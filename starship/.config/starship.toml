
format = """
$directory\
[ ](fg:#88C0D0 bg:#1d2230)\
$git_branch\
$git_status\
[ ](fg:#1d2230)\
\n$character
"""

right_format = """
$python\
${custom.uv_venv}\
$cmd_duration\
$username\
✨
$time
"""

# コマンドラインに1行分のスペースを入れる
add_newline = true

[username]
style_user = "white bold"
style_root = "black bold"
format = "user: [$user]($style) "
disabled = false


# left_promptとright_promptの間を何で埋めるか設定
[fill]
symbol = ' '

[directory]
style = "fg:#2E3440 bg:#88C0D0 bold"
# format = "[ $path ]($style)"
truncation_length = 10
truncate_to_repo = false
truncation_symbol = "…/"
# truncation_symbol = ' ' # nf-fa-folder_open
# truncate_to_repo = false
# style = 'fg:#7aa2f7 bg:#1a1b26'
read_only = ' 󰌾 ' # nf-md-lock
read_only_style = 'fg:#f7768e bg:#1a1b26'
format = '[ $path ]($style)[$read_only]($read_only_style)'


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[aws]
disabled = true
[gcloud]
disabled = true

[git_branch]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#1d2230)]($style)'
only_attached = true

[git_status]
style = "bg:#1d2230"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#1d2230)]($style)'

[cmd_duration]
min_time = 1
style = 'fg:#e0af68'
format = "[$duration]($style)" # nf-pl-right_soft_divider, nf-mdi-clock

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
# style = "bg:#1d2230"
format = '[[   $time ](fg:#a0a9cb)]($style)'

[character]
vimcmd_symbol = '[V](bold green) '

# ~/.config/starship.toml

[python]
symbol = '󰌠 ' # nf-md-language_python
style = 'fg:#7aa2f7'
# activateしたときだけ表示する(ファイル検出は下の[custom.uv_venv]が担当するので無効化)
detect_extensions = []
detect_files = []
detect_folders = []
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

# activateしない運用(uv run)向けのPython表示
#   .venvが現在地か親にある -> その環境のバージョンと名前 (例: v3.12 (project))
#   .venvが無くPythonのファイルがある -> システムのpython3のバージョン (例: v3.15.2)
#   activate済み -> 何も出さない([python]が表示する)
[custom.uv_venv]
shell = ["sh"]
when = true
command = '''
[ -n "$VIRTUAL_ENV" ] && exit 0
d=$PWD
while [ "$d" != "/" ]; do
  f="$d/.venv/pyvenv.cfg"
  if [ -f "$f" ]; then
    v=$(sed -n 's/^version_info = //p' "$f")
    n=$(sed -n 's/^prompt = //p' "$f")
    echo "v$v (${n:-${d##*/}})"
    exit 0
  fi
  d=$(dirname "$d")
done
set -- *.py pyproject.toml requirements.txt .python-version setup.py Pipfile
for x in "$@"; do
  if [ -e "$x" ]; then
    v=$(python3 --version 2>/dev/null | sed 's/^Python //')
    [ -n "$v" ] && echo "v$v"
    exit 0
  fi
done
'''
format = '([󰌠 $output ](fg:#7aa2f7))'
